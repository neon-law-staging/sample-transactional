name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# The reusable publisher mints its deployment token only on this main-only
# caller. Both callers grant `id-token: write`, because a called workflow
# cannot widen the token the caller granted it and project-gate.yml requests
# that scope in every job — a caller that withholds it fails the run at
# startup rather than inside a step. What the main-only caller adds is not a
# wider token but the live half: project-gate.yml's live document
# verification, live Project gate, and seed import only run on a push to
# `main`.

jobs:
  gate:
    uses: neon-law-source-code/navigator/.github/workflows/project-gate.yml@26.9.22-rc.1
    with:
      project: "sample-transactional"
      host: "staging.neonlaw.com"
  publish:
    needs: gate
    uses: neon-law-source-code/navigator/.github/workflows/project-publish.yml@26.9.22-rc.1
    with:
      project: "sample-transactional"
      host: "staging.neonlaw.com"
